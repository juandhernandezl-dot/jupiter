; PlatformIO Project Configuration File
; ESP32 DevKit v1 — micro-ROS WiFi UDP + MPU6050 DMP + TB6612FNG
; Agente: ros2 run micro_ros_agent micro_ros_agent udp4 --port 8888 -v6

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_microros_transport = wifi
board_microros_distro = humble

lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio
  ; Simple_MPU6050 y Simple_Wire se cargan desde lib/ automáticamente

build_flags =
  -Os
  ; ── WiFi y agente — actualizar si cambia la IP ─────────────
  ; IP del agente: ejecutar  hostname -I  en el PC
  -DWIFI_SSID=\"GalaxyA545GAA0C\"
  -DWIFI_PASSWORD=\"lookbackfujimoto\"
  -DAGENT_IP=\"10.60.123.225\"
  -DAGENT_PORT=8888