; PlatformIO Project Configuration File
; ESP32 DevKit v1 — micro-ROS sobre WiFi (UDP4, puerto 8888)
; Agente: ros2 run micro_ros_agent micro_ros_agent udp4 --port 8888 -v6

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ── micro-ROS ────────────────────────────────────────────────
board_microros_transport = wifi
board_microros_distro = humble

lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio

; ── WiFi y agente — editar aquí ─────────────────────────────
; IP del PC: ejecutar  hostname -I  en la terminal del PC
; La red WiFi debe ser 2.4 GHz (el ESP32 no soporta 5 GHz)
build_flags =
  -DWIFI_SSID=\"GalaxyA545GAA0C\"
  -DWIFI_PASSWORD=\"lookbackfujimoto\"
  -DAGENT_IP=\"10.187.37.225\"
  -DAGENT_PORT=8888